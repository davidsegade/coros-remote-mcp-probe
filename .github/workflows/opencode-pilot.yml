name: OpenCode Pilot

on:
  workflow_dispatch:
    inputs:
      test_openrouter:
        description: "Force OpenRouter fallback test"
        required: false
        default: false
        type: boolean

jobs:
  opencode-pilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Primary - Gemini
        id: gemini
        if: ${{ !inputs.test_openrouter }}
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.8-flash
          use_github_token: true
          share: false
          prompt: |
            IA DEV read-only health check.
            Read README.md only.
            Return exactly three short lines:
            PURPOSE: <repository purpose>
            FILE: README.md
            STATUS: OK

      - name: Fallback 1 - Groq GPT-OSS 120B
        id: groq
        if: ${{ !inputs.test_openrouter && steps.gemini.outcome == 'failure' }}
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: groq/openai/gpt-oss-120b
          use_github_token: true
          share: false
          prompt: |
            IA DEV read-only health check.
            Read README.md only. Do not inspect images, attachments, git history, or other files.
            Return exactly three short lines:
            PURPOSE: <repository purpose>
            FILE: README.md
            STATUS: OK

      - name: Fallback 2 - OpenRouter Free
        id: openrouter
        if: ${{ inputs.test_openrouter || (steps.gemini.outcome == 'failure' && steps.groq.outcome == 'failure') }}
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openrouter/openrouter/free
          use_github_token: true
          share: false
          prompt: |
            IA DEV read-only health check.
            Read README.md only.
            Return exactly three short lines:
            PURPOSE: <repository purpose>
            FILE: README.md
            STATUS: OK
